<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>Trade Session</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    overflow-x:hidden;
    background:#080b10;
    font-family:'Montserrat',sans-serif;
    color:#e6edf3;
}

body{
    background:
        radial-gradient(circle at 15% -5%, rgba(47,124,255,.16), transparent 42%),
        radial-gradient(circle at 88% 32%, rgba(0,214,143,.09), transparent 40%),
        radial-gradient(circle at 50% 105%, rgba(47,124,255,.10), transparent 45%),
        linear-gradient(180deg, #0a0e14 0%, #0c1219 48%, #070a0f 100%);
    background-attachment: fixed;
}

.app{
    width:100%;
    max-width:480px;
    margin:auto;
    padding:0px;
    min-height:100vh;
}

/* TOP */

.stats{
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    gap: 0px;
    padding: 9px 8px;
    margin: 8px 14px 12px 14px;
    border-radius: 18px;
    background: linear-gradient(180deg, #16202c, #0c131b);
    border: 1px solid rgba(47, 124, 255, .18);
    box-shadow: 0 8px 24px rgba(0,0,0,.45), 0 0 18px rgba(47,124,255,.07), inset 0 1px 0 rgba(255,255,255,.04);
}

.stat{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:700;
    font-variant-numeric: tabular-nums;
    letter-spacing:.2px;
}

.light{
    opacity:.55;
    font-weight:500;
    font-size: 11px;
    letter-spacing:0;
}

.red-dot{
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00d68f;
    box-shadow: 0 0 10px #00d68f;
    animation: pulse 1.6s infinite;
}

.green{
    color:#00d68f;
    text-shadow: 0 0 12px rgba(0,214,143,.35);
}

@keyframes pulse{
    0%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.45); opacity:.4; }
    100%{ transform:scale(1); opacity:1; }
}

.divider {
    width: 1px;
    height: 20px !important;
    background: linear-gradient(180deg, transparent, rgba(47,124,255,.45), transparent);
}

/* TICKER */

.ticker{
    overflow:hidden;
    margin-bottom:10px;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
}

.ticker-track{
    display:flex;
    gap:8px;
    width:max-content;
    animation:ticker 45s linear infinite;
}

.win-box{
    min-width: 140px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 12px;
    border-radius: 14px;
    background: linear-gradient(180deg, #151e29, #0b1118);
    border: 1px solid rgba(47,124,255,.13);
    font-size: 12px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color:#c8d4e0;
}

.green-dot{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #00d68f;
    box-shadow: 0 0 8px #00d68f;
    flex-shrink:0;
}

@keyframes ticker{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
}

/* PROMO */

.promo{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0px;
    padding: 8px 10px;
    margin: 0px 14px;
    border-radius: 20px;
    background:
        linear-gradient(180deg, rgba(47,124,255,.12), rgba(0,0,0,0)),
        linear-gradient(180deg, #101a26, #0a1017);
    border: 1.5px solid rgba(47, 124, 255, .30);
    box-shadow: 0 0 26px rgba(47,124,255,.12), inset 0 1px 0 rgba(255,255,255,.05);
    margin-bottom: 14px;
}

.promo-left{
    display:flex;
    align-items:center;
}

.gift{
    width: 40px;
    height: 40px;
    border-radius: 14px;
    background: rgba(47,124,255,.14);
    border: 1px solid rgba(47,124,255,.22);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin-right: 8px;
}

.promo-title{
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    color:#9db0c5;
}

.promo-bonus{
    font-size: 16px;
    line-height: 1.1;
    font-weight: 700;
    color: #00d68f;
    text-shadow: 0 0 16px rgba(0,214,143,.35);
    font-variant-numeric: tabular-nums;
}

.promo-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.info{
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.16);
    color: #cdd9e5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-style: italic;
}

.copy-promo-btn{
    min-width: 96px;
    height: 36px;
    border-radius: 12px;
    background: linear-gradient(180deg, #00e69b, #00b578);
    border: none;
    color: #04120c;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    padding: 0 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(0,214,143,.28);
    transition: transform .15s ease, box-shadow .15s ease;
}

.copy-promo-btn:active{
    transform: scale(.96);
}

/* GAMES */

.games{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin: 14px;
    margin-bottom: 80px;
}

.card{
    position:relative;
    padding:14px;
    border-radius:20px;
    background: linear-gradient(180deg, #18222e 0%, #0d141c 100%);
    border:1px solid rgba(47,124,255,.14);
    box-shadow: 0 10px 26px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);
    transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}

.card::before{
    content:'';
    position:absolute;
    inset:0;
    border-radius:20px;
    pointer-events:none;
    opacity:.5;
    background-image:
        repeating-linear-gradient(90deg, rgba(47,124,255,.045) 0 1px, transparent 1px 22px),
        repeating-linear-gradient(0deg, rgba(47,124,255,.045) 0 1px, transparent 1px 22px);
    -webkit-mask-image: linear-gradient(180deg, #000, transparent 55%);
            mask-image: linear-gradient(180deg, #000, transparent 55%);
}

.card:active{
    transform: scale(.98);
    border-color: rgba(47,124,255,.30);
}

.badge{
    position: absolute;
    top: 7px;
    right: 7px;
    padding: 4px 7px;
    border-radius: 8px;
    font-size: 9px;
    font-weight: 800;
    letter-spacing:.5px;
    z-index:2;
}

.hot{ background:#f0b90b; color:#0a0e14; box-shadow: 0 0 12px rgba(240,185,11,.45); }
.new{ background:#2f7cff; color:#fff; box-shadow: 0 0 12px rgba(47,124,255,.55); }
.vip{ background:#8b5cf6; color:#fff; box-shadow: 0 0 12px rgba(139,92,246,.55); }
.top{ background:#f6465d; color:#fff; box-shadow: 0 0 12px rgba(246,70,93,.55); }

.game-image{
    width:100%;
    aspect-ratio:1/1;
    border-radius:14px;
    overflow:hidden;
    margin-bottom:12px;
    position:relative;
    background:#0a0f15;
    border:1px solid rgba(255,255,255,.05);
}

.game-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.game-title{
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.7px;
    margin-bottom: 12px;
    color: #d3dfeb;
    position:relative;
    z-index:1;
}

.play-btn{
    width: 100%;
    height: 36px;
    border: none;
    outline: none;
    border-radius: 12px;
    background: linear-gradient(180deg, #00e69b, #00b578);
    color: #04120c;
    font-size: 12px;
    font-weight: 800;
    letter-spacing:.4px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0,214,143,.25);
    animation: playPulse 2.8s infinite ease-in-out;
}

.play-btn::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    animation: shine 3.4s infinite;
}

@keyframes shine {
    0% { left: -100%; }
    100% { left: 100%; }
}

@keyframes playPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.035); }
    100% { transform: scale(1); }
}

/* Верхняя панель с промокодом */
.top-notification{
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%) translateY(-120%);
    width: 92%;
    max-width: 430px;
    z-index: 99999;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
}

.top-notification.show{
    transform: translateX(-50%) translateY(10px);
    pointer-events: auto;
}

.notification-inner{
    border-radius: 22px;
    padding: 16px 14px;
    background:
        radial-gradient(circle at top, rgba(47,124,255,.16) 0%, rgba(0,0,0,0) 65%),
        linear-gradient(180deg, #131d28 0%, #080c11 100%);
    border: 1.5px solid rgba(47,124,255,.28);
    box-shadow: 0 20px 50px rgba(0,0,0,.6), 0 0 40px rgba(47,124,255,.12), inset 0 1px 0 rgba(255,255,255,.05);
    position: relative;
    opacity: 98%;
}

.notif-close{
    position: absolute;
    top: 10px;
    right: 10px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.05);
    color: #cdd9e5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    cursor: pointer;
    line-height: 1;
}

.notif-top{
    display: flex;
    gap: 14px;
}

.notif-gift{
    width: 72px;
    height: 56px;
    min-width: 56px;
    border-radius: 16px;
    background: rgba(47,124,255,.14);
    border: 1px solid rgba(47,124,255,.22);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
}

.notif-title{
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 8px;
    color:#f1f6fb;
}

.notif-text{
    font-size: 14px;
    line-height: 1.25;
    opacity: .78;
    color:#c8d4e0;
}

.promo-copy{
    margin-top: 16px;
    border-radius: 14px;
    padding: 12px 16px;
    background: linear-gradient(180deg, rgba(0,214,143,.10), rgba(0,0,0,0)), #0b1118;
    border: 1.5px solid rgba(0,214,143,.28);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0px;
}

.copy-left small{
    display: block;
    font-size: 10px;
    letter-spacing: 1px;
    opacity: .6;
    margin-bottom: 2px;
}

.copy-left h2{
    color: #00d68f;
    font-size: 20px;
    letter-spacing: 1px;
    text-shadow: 0 0 14px rgba(0,214,143,.35);
}

.copy-btn{
    border: none;
    min-width: 106px;
    height: 38px;
    border-radius: 12px;
    background: linear-gradient(180deg, #00e69b, #00b578);
    color: #04120c;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,214,143,.3);
    animation: pulseBtn 2.2s infinite;
}

@keyframes pulseBtn {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

/* Карточка Telegram */
.card-wide { grid-column: span 2; }
.card-wide .game-image { aspect-ratio: 2 / 1; }

.badge-tg {
    background: #2f7cff;
    color: #fff;
    box-shadow: 0 0 12px rgba(47,124,255,.55);
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 4px 8px;
    font-size: 10px;
}

</style>

</head>

<body>

<div class="app">

    <!-- TOP -->

    <div class="stats">

        <div class="stat">

            <div class="red-dot"></div>

            <div>
                <span id="online">340</span>
                <span class="light"> трейдеров онлайн</span>
            </div>

        </div>

        <span class="divider"></span>

        <div class="stat">

            <span class="green" id="deals">2650</span>

            <span class="light"> сделок сегодня</span>

        </div>

    </div>

    <!-- TICKER -->

    <div class="ticker">
        <div class="ticker-track" id="ticker"></div>
    </div>

    <!-- PROMO -->

    <div class="promo">

        <div class="promo-left">

            <div class="gift">🎁</div>

            <div>

                <div class="promo-title">
                    промокод: SESSION
                </div>

                <div class="promo-bonus">
                    +60% на счёт
                </div>

            </div>

        </div>

        <div class="promo-right">

            <div class="info" id="openNotification">
                i
            </div>

            <button class="copy-promo-btn" id="promoCopyBtn">
                Копировать
            </button>

        </div>

    </div>

    <!-- CARDS -->

    <div class="games">

        <div class="card card-wide">

            <div class="badge badge-tg">СИГНАЛЫ</div>

            <div class="game-image">
                <img src="tg.png" alt="Telegram">
            </div>

            <div class="game-title">
                ТОРГОВЫЙ БОТ ДЛЯ СЕССИЙ
            </div>

            <button
            class="play-btn"
            onclick="window.location.href='https://t.me/trade_session_bot'">
                ЗАБРАТЬ БОТА
            </button>

        </div>

        
        
        
        <div class="card card-wide">

            <div class="badge badge-tg">СИГНАЛЫ</div>

            <div class="game-image">
                <img src="tg.png" alt="Telegram">
            </div>

            <div class="game-title">
                ТОРГУЕМ ТУТ
            </div>

            <button
            class="play-btn"
            onclick="window.location.href='https://u3.shortink.io/register?utm_campaign=815692&utm_source=affiliate&utm_medium=sr&a=V4wUp2cVBOcQdW&al=1811609&ac=promo_session&cid=991865&code=SESSION'">
                ЗАРЕГЕСТРИРОВАТЬСЯ
            </button>

        </div>

        
        
        
        <div class="card card-wide">

            <div class="badge badge-tg">СИГНАЛЫ</div>

            <div class="game-image">
                <img src="tg.png" alt="Telegram">
            </div>

            <div class="game-title">
                TELEGRAM КАНАЛ
            </div>

            <button
            class="play-btn"
            onclick="window.location.href='https://t.me/+z1nso7-D7ENlMzFi'">
                ПОДПИСАТЬСЯ
            </button>

        </div>

    </div>

</div>

<!-- Верхняя панель с промокодом (только по клику на "i") -->

<div class="top-notification" id="topNotification">

    <div class="notification-inner">

        <div class="notif-close" id="closeNotification">
            ×
        </div>

        <div class="notif-top">

            <div class="notif-gift">
                🎁
            </div>

            <div>

                <div class="notif-title">
                    Заберите бонус
                </div>

                <div class="notif-text">
                    Получите бонус 60% на первое пополнение, используя этот промокод.
                </div>

            </div>

        </div>

        <div class="promo-copy">

            <div class="copy-left">

                <small>ПРОМОКОД</small>

                <h2 id="topPromoCode">
                    SESSION
                </h2>

            </div>

            <button class="copy-btn" id="topCopyBtn">
                Копировать
            </button>

        </div>

    </div>

</div>

<script>

/* ТРЕЙДЕРЫ ОНЛАЙН — от 310 до 375 */
const ONLINE_MIN = 310;
const ONLINE_MAX = 375;

let online = Math.floor(Math.random() * (ONLINE_MAX - ONLINE_MIN + 1)) + ONLINE_MIN;
document.getElementById('online').innerText = online;

setInterval(() => {
    online += Math.floor(Math.random() * 7) - 3; // -3 ... +3
    if (online < ONLINE_MIN) online = ONLINE_MIN;
    if (online > ONLINE_MAX) online = ONLINE_MAX;
    document.getElementById('online').innerText = online;
}, 2500);

/* СДЕЛОК СЕГОДНЯ — старт 2578–2749, +1 каждые 2–3 секунды */
const DEALS_MIN = 2578;
const DEALS_MAX = 2749;

let deals = Math.floor(Math.random() * (DEALS_MAX - DEALS_MIN + 1)) + DEALS_MIN;
document.getElementById('deals').innerText = deals;

function scheduleDealsUpdate() {
    const delay = Math.floor(Math.random() * 1000) + 2000; // 2000–3000 мс
    setTimeout(() => {
        deals += 1;
        document.getElementById('deals').innerText = deals;
        scheduleDealsUpdate();
    }, delay);
}
scheduleDealsUpdate();

/* TICKER — выплаты от 151 до 793 */

const ticker = document.getElementById('ticker');

function tickerItem(){
    const id = Math.floor(Math.random()*900)+100;
    const amount = Math.floor(Math.random() * (793 - 151 + 1)) + 151;

    return `
    <div class="win-box">
        <div class="green-dot"></div>
        <div>ID: ${id}***</div>
        <div class="green">+$${amount}</div>
    </div>
    `;
}

let tickerHtml = '';
for(let i=0;i<20;i++){
    tickerHtml += tickerItem();
}
ticker.innerHTML = tickerHtml + tickerHtml;

/* ВЕРХНЯЯ ПАНЕЛЬ С ПРОМОКОДОМ — только по клику на "i" */

const topNotification = document.getElementById('topNotification');
const promoCode = 'SESSION';

function showNotification() {
    if (topNotification.classList.contains('show')) return;
    topNotification.classList.add('show');
}

function hideNotification() {
    topNotification.classList.remove('show');
}

document.getElementById('openNotification').addEventListener('click', showNotification);
document.getElementById('closeNotification').addEventListener('click', hideNotification);

document.getElementById('promoCopyBtn').addEventListener('click', async function() {
    try {
        await navigator.clipboard.writeText(promoCode);
        const btn = this;
        btn.textContent = 'Скопировано';
        setTimeout(() => {
            btn.textContent = 'Копировать';
        }, 1500);
    } catch (err) {
        alert('Скопируйте вручную: ' + promoCode);
    }
});

document.getElementById('topCopyBtn').addEventListener('click', async function() {
    try {
        await navigator.clipboard.writeText(promoCode);
        const btn = this;
        btn.textContent = 'Скопировано';
        setTimeout(() => {
            btn.textContent = 'Копировать';
        }, 1500);
    } catch (err) {
        alert('Скопируйте вручную: ' + promoCode);
    }
});

</script>

</body>
</html>
